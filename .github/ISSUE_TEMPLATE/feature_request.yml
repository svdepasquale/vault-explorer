name: Feature request
description: Suggest a view, a health check or another enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this would solve
      description: What is inconvenient, missing, or limiting today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen? Include alternatives you considered. The explorer stays read-only and local.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, references.
