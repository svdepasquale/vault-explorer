name: ci

# Typecheck, unit + integration tests and the production build, on every pull
# request and on every push to main. One job on purpose: the steps share a
# single `npm ci`, and the first red step already names what broke.

on:
  pull_request:
  push:
    branches:
      - main

# Read-only. Nothing here writes to the repo, publishes a package or mints an
# OIDC token.
permissions:
  contents: read

# The group key MUST keep `github.ref`. A concurrency group holds at most one
# pending run and evicts the older queued one, so a ref-less key would let
# unrelated pull requests cancel each other's checks. With the ref in the key
# only a superseded push to the same pull request is cancelled.
#
# Cancel only for pull_request: on main every push shares `refs/heads/main`,
# so cancelling there would leave the earlier commits never checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Dropping the token from .git/config
          # keeps it away from every npm lifecycle script that `npm ci` runs.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The major the project is developed and run on: the server is
          # TypeScript that Node executes natively (type stripping).
          node-version: '26'
          # No dependency cache: one more moving part for a lockfile this
          # small. Explicit, because setup-node turns caching on by itself as
          # soon as package.json gains a `packageManager` field.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unit tests, plus integration tests that `git init` throwaway repos in
      # the runner's temp dir. They set their own identity and signing config,
      # so they need nothing but the `git` binary ubuntu runners ship.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Vitest compiles the TypeScript through Vite, never through Node's own
      # type stripping, which is how `npm start` and the package bin run it.
      # `--help` imports the whole server module graph that way, prints the
      # usage and exits before binding a port or opening a vault.
      - name: Smoke-test the server entry under Node type stripping
        run: node bin/vault-explorer.js --help
