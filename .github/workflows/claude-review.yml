name: claude-review

# Tranche C of the 2026-08-22 GitHub Pro evaluation. Deliberately NOT part of
# the $4/mo calculation: this depends on the Claude subscription and the Claude
# GitHub App, and works the same on Free. It is here because it covers what no
# scanner does — intent, not syntax.
#
# INERT UNTIL A TOKEN EXISTS. The job self-skips while the
# `CLAUDE_CODE_OAUTH_TOKEN` secret is unset, so this can be merged before the
# setup is done. To activate:
#   1. install the Claude GitHub App on this repo
#   2. run `claude setup-token` locally
#   3. `gh secret set CLAUDE_CODE_OAUTH_TOKEN -R svdepasquale/vault-explorer`
# Nothing else needs to change; the next PR picks it up.
#
# THIS IS ADVISORY AND MUST NEVER BE A GATE. Claude posts comments, it cannot
# approve, and no ruleset here lists it as a required check. A review that can
# block a merge is a review that gets rubber-stamped. The real gate is the
# human `gh pr merge`: this repo has no Renovate and auto-merge is off, so no
# PR lands without one. Most changes are direct pushes to `main`, which this
# review never sees.

# No `issue_comment` trigger, so no `@claude` mentions: this repo is public,
# anyone can comment, and a comment-triggered run holds the repo's secrets and
# a write-scoped token, on a fork's PR too. zizmor flags that trigger as
# dangerous since 1.31.0. For a re-read after more commits, flip the PR to
# draft and back: `gh pr ready --undo <n> && gh pr ready <n>`.
on:
  pull_request:
    # No `synchronize`: re-reviewing on every push burns Actions minutes for
    # diminishing returns; `ready_for_review` is the re-read switch above.
    types: [opened, ready_for_review]

# Workflow level stays read-only. The two write scopes the action needs to
# post its comment live on the `review:` job below, so a step added to this
# file later — including anything the pinned claude-code-action itself runs —
# does not inherit a token that can write PR and issue comments just by being
# here. ci-security.yml would not catch a regression: it runs zizmor's default
# persona, and `excessive-permissions` at the workflow level is auditor-only.
permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scoped to the one job that actually posts. Claude comments on the PR
    # (pull-requests) and on issue-comment threads (issues); it cannot
    # approve, and `claude_args` keeps its toolset read-only.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # `secrets` is not usable in a job-level `if:`, so the presence check has
      # to be a step that exports a flag. Every later step hangs off it.
      - name: Is Claude configured?
        id: gate
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLAUDE_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=claude-review inactive::CLAUDE_CODE_OAUTH_TOKEN is not set. Install the Claude GitHub App, run 'claude setup-token', then 'gh secret set CLAUDE_CODE_OAUTH_TOKEN'. Skipping."
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the review is much better when it can read why the
          # surrounding code got that way, and this repo keeps its reasoning in
          # commit messages rather than in docs.
          fetch-depth: 0
          persist-credentials: false

      - name: Claude review
        if: steps.gate.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1.0.234
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          # OFF: these links hand a reader a one-click path into editing the
          # repo from a review comment. Nothing deploys from here, so this is a
          # preference rather than a guard; it stays off until wanted.
          include_fix_links: false
          # Empty = no bot-authored trigger is honoured, which is the default
          # and is kept deliberately: a bot's PR body is untrusted text (a
          # Dependabot security PR embeds upstream release notes verbatim).
          # Do not set this to '*' here.
          allowed_bots: ""
          # Read-only toolset. Claude reviews; it does not edit, commit, or run
          # anything that mutates. Widening this is what turns an advisory
          # reviewer into an actor on the repo.
          claude_args: >-
            --allowedTools Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*)
          prompt: |
            Review this pull request for vault-explorer: a local, read-only
            graphical explorer for a private markdown knowledge vault, run by its
            single user on one Mac (a Node server on 127.0.0.1 plus a React SPA;
            nothing is deployed). The repo is public; the vault it reads is not.

            Weight your attention by what a mistake would cost, not by line count:

            1. The read-only contract. Nothing in this code may write inside the
               vault or commit there. Git runs with `--no-optional-locks`
               (`src/core/git.ts`), and the only file the app writes is its own
               config (`src/server/config.ts`).
            2. Privacy. Tests use the synthetic fixture in `test/fixtures/vault/`;
               no real page names, hosts or vault text belong in fixtures,
               screenshots, issues or commit messages.
            3. The local server (`src/server/http.ts`). It binds 127.0.0.1, and
               its Host and Origin allowlists are what keep another site open in
               the browser from driving it. A request reaches files and processes
               only through the model's page ids, the vault path the user picks
               and the recall query on stdin; anything that widens that (a path
               outside the model, a process argument built from request text, a
               looser Host or Origin check) is a real hole.
            4. `src/shared/model.ts` is the contract between server and SPA; a
               change there must land on both sides.
            5. The conventions in `CLAUDE.md`: erasable TypeScript syntax only
               (Node strips the types at run time), colors only from the
               validated palette, and the gotchas it lists.
            6. Whether the comments still tell the truth. This codebase treats
               comments as load-bearing documentation, and a comment that has
               gone stale is treated as a defect, not a nit.

            Be specific and cite `file:line`. If you are unsure whether
            something is a real problem, say so rather than padding the review —
            a short accurate review is worth more than a thorough-looking one.
            Do not comment on formatting, and do not restate what the diff does.
